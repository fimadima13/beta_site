<style>
.run-main{max-width:640px; width:100%; margin:0 auto; padding:36px 24px 90px; flex:1;}

.intro-card{border:1px solid var(--line); background:var(--card); border-radius:20px; padding:32px;}
.intro-card h1{font-size:21px; font-weight:700; margin:0 0 10px; letter-spacing:-.01em;}
.intro-card .meta-row{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.meta-chip{font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--line); padding:5px 12px; border-radius:999px; background:rgba(255,255,255,.02);}
.intro-card p{font-size:14px; color:#d6d6d6; line-height:1.6; margin:0 0 14px;}
.intro-card p.why{color:var(--muted); font-size:13.5px;}
.start-btn{width:100%; height:50px; border-radius:999px; background:var(--pill); color:var(--pill-ink); font-size:15px; font-weight:600; margin-top:12px;}

.quiz-card{border:1px solid var(--line); background:var(--card); border-radius:20px; padding:32px; display:none;}
.quiz-card.show{display:block;}
.quiz-progress{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
.quiz-track{height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:26px;}
.quiz-fill{height:100%; background:#fff; border-radius:999px; transition:width .3s ease;}
.quiz-question{font-size:18px; font-weight:700; color:var(--ink); line-height:1.4; margin:0 0 22px;}
.quiz-options{display:flex; flex-direction:column; gap:10px;}
.quiz-option{
  display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:14px;
  border:1px solid var(--line); background:rgba(255,255,255,.02); text-align:left;
  font-size:14.5px; color:#e2e2e2; transition:border-color .15s ease, background .15s ease;
}
.quiz-option:hover{background:var(--card-hover); border-color:rgba(255,255,255,.25);}
.quiz-option .opt-letter{
  width:28px; height:28px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--muted);
}
.quiz-back{margin-top:20px; font-size:13px; color:var(--muted);}
.quiz-back:hover{color:#fff;}

.done-card{border:1px solid rgba(185,204,227,.25); background:rgba(185,204,227,.05); border-radius:20px; padding:40px 32px; text-align:center; display:none;}
.done-card.show{display:block;}
.done-icon{width:56px; height:56px; border-radius:16px; background:rgba(185,204,227,.12); border:1px solid rgba(185,204,227,.3); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:#b9cce3;}
.done-card h2{font-size:19px; font-weight:700; margin:0 0 10px; color:var(--ink);}
.done-card p{font-size:14px; color:var(--muted); line-height:1.6; margin:0 0 22px; max-width:420px; margin-left:auto; margin-right:auto;}
.done-cta{display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 26px; border-radius:999px; background:var(--pill); color:var(--pill-ink); font-size:14px; font-weight:600;}

.page-loading{flex:1; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:14px; padding:60px 24px;}
</style>
</head>

  <section class="intro-card" id="introCard">
    <h1 id="introTitle"></h1>
    <div class="meta-row">
      <span class="meta-chip" id="introDuration"></span>
      <span class="meta-chip" id="introCount"></span>
    </div>
    <p id="introAbout"></p>
    <p class="why" id="introWhy"></p>
    <button class="start-btn" id="startBtn">Начать тест</button>
  </section>

    <div class="quiz-progress" id="quizProgress"></div>
    <div class="quiz-track"><div class="quiz-fill" id="quizFill" style="width:0%"></div></div>
    <p class="quiz-question" id="quizQuestion"></p>
    <div class="quiz-options">
      <button class="quiz-option" id="optA"><span class="opt-letter">A</span><span id="optAText"></span></button>
      <button class="quiz-option" id="optB"><span class="opt-letter">B</span><span id="optBText"></span></button>
    </div>
  </section>

    <div class="done-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2>Тест пройден</h2>
    <p id="doneText">Ваши ответы сохранены. Как только партнёр тоже пройдёт этот тест, вы увидите общий отчёт.</p>
    <a class="done-cta" href="couple-test.html">Вернуться к совместимости</a>
  </section>

</main>

<script type="module">
import { getClient, isConfigured, getSession } from "./assets/auth.js";
import { getCoupleLink, COUPLE_TEST_META, COUPLE_QUESTION_BANKS, saveCoupleTestResult } from "./assets/couple-features.js";

const params = new URLSearchParams(window.location.search);
const testKey = params.get("key");

let client = null;
let userId = null;
let coupleLink = null;
let questions = [];
let currentIndex = 0;
const answers = {};

function renderIntro(meta) {
  document.getElementById("introTitle").textContent = meta.title;
  document.getElementById("introDuration").textContent = meta.duration;
  document.getElementById("introCount").textContent = meta.questionsCount + " вопросов";
  document.getElementById("introAbout").textContent = meta.about;
  document.getElementById("introWhy").textContent = meta.why;
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById("quizProgress").textContent = "Вопрос " + (currentIndex + 1) + " из " + questions.length;
  document.getElementById("quizFill").style.width = Math.round((currentIndex / questions.length) * 100) + "%";
  document.getElementById("quizQuestion").textContent = q.text;
  document.getElementById("optAText").textContent = q.a;
  document.getElementById("optBText").textContent = q.b;
}

function selectAnswer(letter) {
  const q = questions[currentIndex];
  answers[q.id] = letter;
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    finishQuiz();
  }
}

async function finishQuiz() {
  document.getElementById("quizCard").classList.remove("show");
  try {
    await saveCoupleTestResult(client, coupleLink.id, userId, testKey, { answers, scores: {} });
  } catch (err) {
    console.error(err);
    alert("Не удалось сохранить результат. Попробуйте ещё раз.");
    document.getElementById("quizCard").classList.add("show");
    return;
  }
  document.getElementById("doneCard").classList.add("show");
}

document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("introCard").style.display = "none";
  document.getElementById("quizCard").classList.add("show");
  currentIndex = 0;
  renderQuestion();
});
document.getElementById("optA").addEventListener("click", () => selectAnswer("a"));
document.getElementById("optB").addEventListener("click", () => selectAnswer("b"));

async function init() {
  const meta = COUPLE_TEST_META[testKey];
  const bank = COUPLE_QUESTION_BANKS[testKey];
  if (!meta || !bank) {
    document.getElementById("pageLoading").innerHTML = "<span>Тест не найден. <a href=\"couple-test.html\">Вернуться</a></span>";
    return;
  }
  questions = bank;

  if (!isConfigured()) { document.getElementById("pageLoading").innerHTML = "<span>Supabase не настроен.</span>"; return; }
  let session;
  try {
    client = getClient();
    session = await getSession(client);
  } catch (err) { console.error(err); document.getElementById("pageLoading").innerHTML = "<span>Ошибка подключения.</span>"; return; }
  if (!session) { window.location.href = "login.html"; return; }
  userId = session.user.id;

  coupleLink = await getCoupleLink(client, userId);
  if (!coupleLink) {
    document.getElementById("pageLoading").innerHTML = "<span>Сначала подключите партнёра. <a href=\"couple.html\">Режим пары</a></span>";
    return;
  }

  document.getElementById("pageLoading").style.display = "none";
  document.getElementById("pageContent").style.display = "block";
  renderIntro(meta);
}

init();
</script>
